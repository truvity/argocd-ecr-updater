{{- if .Values.registries }}
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-ecr-updater-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-ecr-updater
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-ecr-updater
    spec:
      serviceAccountName: argocd-ecr-updater
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        {{- range .Values.registries }}
        - name: seed-{{ .secret | trimPrefix "ecr-repo-creds-" }}
          image: {{ include "argocd-ecr-updater.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - --region={{ $.Values.awsRegion }}
            - --namespace={{ $.Release.Namespace }}
            - --secrets={{ .secret }}
            - --registry-url={{ .url }}
            - --seed
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        {{- end }}
{{- end }}
