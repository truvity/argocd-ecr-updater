apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-ecr-updater
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-ecr-updater
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: argocd-ecr-updater
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: argocd-ecr-updater
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          containers:
            - name: ecr-token-refresh
              image: {{ include "argocd-ecr-updater.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - --region={{ .Values.awsRegion }}
                - --namespace={{ .Release.Namespace }}
                - --secrets={{ $names := list }}{{ range .Values.registries }}{{ $names = append $names .secret }}{{ end }}{{ join "," $names }}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
