# argocd-ecr-updater: refreshes ECR tokens for ArgoCD repo-creds
# Secrets. The CronJob refreshes on a schedule; a PostSync hook seeds
# each missing Secret on first deploy (ECR tokens live 12h; ArgoCD has
# no native refresher).

image:
  repository: ghcr.io/truvity/argocd-ecr-updater/updater
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

schedule: "0 */6 * * *"

# AWS region where the registries live. No default: every estate provides
# its own (eu-central-1, eu-west-1, us-east-1, etc).
awsRegion: "eu-example-1"

# Registries: repo-creds Secret name -> OCI registry URL. The PostSync
# seed hook creates each missing Secret with its url; the CronJob
# refreshes tokens (one ECR token authenticates the caller against any
# registry whose repo policies grant it). The Role's patch rule is
# scoped to exactly these Secret names.
registries: []
# - secret: ecr-repo-creds-stable
#   url: "oci://<account>.dkr.ecr.<region>.amazonaws.com"

serviceAccount:
  # Extra ServiceAccount annotations. AWS access is auth-agnostic: wire
  # an EKS Pod Identity association estate-side, or set an IRSA role
  # here (eks.amazonaws.com/role-arn: <the role's ARN>).
  # The role needs ecr:GetAuthorizationToken.
  annotations: {}

# Arch scheduling for the CronJob and seed hook pods: required estate
# inputs, no defaults. Set them on clusters with the arch taint convention;
# set to {} and [] on clusters without it.
nodeSelector: {}
tolerations: []
